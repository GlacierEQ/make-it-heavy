version: 1
workers:
  - template_id: source_mapper.turn7
    role: source_mapper
    objective: Map only what the immutable Turn-6 evidence directly establishes and expose every remaining inference boundary.
    task_template: |
      MISSION:
      {mission}

      ROLE: SOURCE MAPPER
      Produce exactly these sections:
      ## TURN 7 SOURCE MAP
      ## DIRECTLY ENTITLED CLAIMS
      ## SEMANTIC FIREWALL BOUNDARY
      ## INFRASTRUCTURE ATTRIBUTION BOUNDARY
      ## HANDOFF

      Apply the mission's Atomic Semantic Claim Firewall literally. Under the first section, include one classified line naming SOURCE_ENTAILS_CLAIM, SOURCE_CONTRADICTS_CLAIM, and SOURCE_INSUFFICIENT. End with `NEXT-TURN TEMPLATE ADJUSTMENT:` and one concrete improvement.

      {runtime_adjustment}
    required_sections: ["TURN 7 SOURCE MAP", "DIRECTLY ENTITLED CLAIMS", "SEMANTIC FIREWALL BOUNDARY", "INFRASTRUCTURE ATTRIBUTION BOUNDARY", "HANDOFF"]
    source_target: 0
    ideal_chars: [900, 3600]
    weights: {completion: 0.18, evidence: 0.24, specificity: 0.16, novelty: 0.08, actionability: 0.08, truth: 0.20, efficiency: 0.06}

  - template_id: adversarial_breaker.turn7
