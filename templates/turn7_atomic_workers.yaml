    objective: Attack false entailment, false contradiction, source ambiguity, and attribution collapse without broadening beyond the supplied evidence.
    task_template: |
      MISSION:
      {mission}

      ROLE: ADVERSARIAL BREAKER
      Produce exactly these sections:
      ## RED TEAM VERDICT
      ## FALSE ENTAILMENT ATTACKS
      ## FALSE CONTRADICTION ATTACKS
      ## ATTRIBUTION ATTACKS
      ## REQUIRED HARDENING
      ## STOP CONDITION

      Prefer one falsifiable held-out attack over generic criticism. Apply the Atomic Semantic Claim Firewall literally. Under the first section, include one classified line naming SOURCE_ENTAILS_CLAIM, SOURCE_CONTRADICTS_CLAIM, and SOURCE_INSUFFICIENT. End with `NEXT-TURN TEMPLATE ADJUSTMENT:` and one concrete improvement.

      {runtime_adjustment}
    required_sections: ["RED TEAM VERDICT", "FALSE ENTAILMENT ATTACKS", "FALSE CONTRADICTION ATTACKS", "ATTRIBUTION ATTACKS", "REQUIRED HARDENING", "STOP CONDITION"]
    source_target: 0
    ideal_chars: [900, 3600]
    weights: {completion: 0.15, evidence: 0.20, specificity: 0.15, novelty: 0.15, actionability: 0.10, truth: 0.20, efficiency: 0.05}

