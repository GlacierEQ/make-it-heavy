      {runtime_adjustment}
    required_sections: ["NEXT PROOF SLICE", "HELD OUT CASE FAMILIES", "ATTRIBUTION CONTROLS", "PASS FAIL BLOCKED", "RECEIPT CONTRACT", "HANDOFF"]
    source_target: 0
    ideal_chars: [900, 3600]
    weights: {completion: 0.18, evidence: 0.20, specificity: 0.20, novelty: 0.07, actionability: 0.16, truth: 0.14, efficiency: 0.05}

