name: Materialize Turn 6 Runtime Semantic Gate V2

on:
  push:
    branches:
      - innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
    paths:
      - .github/workflows/materialize-turn6-runtime-gate-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Patch production semantic gate
        shell: python
        run: |
          from pathlib import Path

          path = Path('claim_aware_innovation.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = """from innovation_loop import (
              AdaptiveWorkerLoop,
              InnovationConfigurationError,
              WorkerTemplate,
          )
          """
          if 'from immutable_span_resolver import LocalGitImmutableSpanResolver' not in text:
              assert import_anchor in text
              text = text.replace(
                  import_anchor,
                  import_anchor
                  + "\nfrom immutable_span_resolver import LocalGitImmutableSpanResolver\n"
                  + "from semantic_support import OBSERVED_LINE_RE, evaluate_observed_claims\n",
                  1,
              )

          old = "        claim_gate_quality_cap: float = 69.0,\n        **kwargs: Any,\n"
          if 'span_resolver: Any = None' not in text:
              assert old in text
              text = text.replace(
                  old,
                  "        claim_gate_quality_cap: float = 69.0,\n"
                  "        span_resolver: Any = None,\n"
                  "        **kwargs: Any,\n",
                  1,
              )

          old = '        self._evidence_registry: EvidenceRegistry = {}\n'
          if 'self.span_resolver =' not in text:
              assert old in text
              text = text.replace(
                  old,
                  old + '        self.span_resolver = span_resolver or LocalGitImmutableSpanResolver()\n',
                  1,
              )

          semantic_method = '''    def evaluate_semantic_support(self, response: str) -> Dict[str, Any]:
              """Resolve registered immutable spans and evaluate each OBSERVED claim."""

              if not self._evidence_registry:
                  return {
                      "pass": True,
                      "semantic_support_status": "NOT_APPLICABLE",
                      "failure_class": "NONE",
                      "observed_claim_count": 0,
                      "resolved_span_count": 0,
                      "relation_counts": {},
                      "resolutions": [],
                      "results": [],
                  }
              matches = [
                  match
                  for raw_line in response.splitlines()
                  if (match := OBSERVED_LINE_RE.match(raw_line.strip())) is not None
              ]
              if not matches:
                  return {
                      "pass": True,
                      "semantic_support_status": "NOT_APPLICABLE",
                      "failure_class": "NONE",
                      "observed_claim_count": 0,
                      "resolved_span_count": 0,
                      "relation_counts": {},
                      "resolutions": [],
                      "results": [],
                  }

              span_text_by_pointer: Dict[str, str] = {}
              resolutions: List[Dict[str, Any]] = []
              for match in matches:
                  pointer = match.group("pointer").strip()
                  source_id, span_id = self._parse_observed_reference(pointer)
                  spans = self._evidence_registry.get(source_id)
                  locator = (
                      spans.get(span_id)
                      if span_id and isinstance(spans, Mapping)
                      else None
                  )
                  if not locator:
                      continue
                  resolution = self.span_resolver.resolve(pointer, locator)
                  resolutions.append(resolution.to_dict(include_text=False))
                  if resolution.resolved:
                      span_text_by_pointer[pointer] = resolution.span_text

              semantic = evaluate_observed_claims(response, span_text_by_pointer)
              observed_count = int(semantic["observed_claim_count"])
              resolved_count = sum(
                  1 for resolution in resolutions if resolution.get("resolved")
              )
              resolution_complete = resolved_count == observed_count
              semantic_pass = bool(semantic["semantic_gate_pass"] and resolution_complete)
              if not resolution_complete:
                  failure_class = "EVIDENCE_RESOLUTION"
              elif not semantic_pass:
                  failure_class = "CLAIM_SEMANTICS"
              else:
                  failure_class = "NONE"
              semantic.update(
                  {
                      "pass": semantic_pass,
                      "semantic_support_status": (
                          "SOURCE_SUPPORT_PASS" if semantic_pass else "SOURCE_SUPPORT_FAIL"
                      ),
                      "failure_class": failure_class,
                      "resolved_span_count": resolved_count,
                      "resolution_count": len(resolutions),
                      "resolutions": resolutions,
                  }
              )
              return semantic

          '''
          if '    def evaluate_semantic_support(self, response: str)' not in text:
              marker = '    def _score_one(\n'
              assert marker in text
              text = text.replace(marker, semantic_method + marker, 1)

          old = '''        score["claim_gate"] = claim_gate
                  score["pre_claim_gate_quality_score"] = score["quality_score"]
                  score["pre_claim_gate_benefit_score"] = score["benefit_score"]

                  if reliable and not claim_gate["pass"]:
          '''
          if 'score["semantic_gate"] = semantic_gate' not in text:
              assert old in text
              new = '''        semantic_gate = (
                      self.evaluate_semantic_support(response)
                      if reliable
                      else {
                          "pass": False,
                          "semantic_support_status": "RUNTIME_FAILURE",
                          "failure_class": "RUNTIME_FAILURE",
                          "observed_claim_count": 0,
                          "resolved_span_count": 0,
                          "relation_counts": {},
                          "resolutions": [],
                          "results": [],
                      }
                  )
                  if reliable and claim_gate.get("evidence_registry_active"):
                      claim_gate["semantic_support_status"] = semantic_gate[
                          "semantic_support_status"
                      ]
                      claim_gate["semantic_support_unchecked_count"] = 0
                  score["claim_gate"] = claim_gate
                  score["semantic_gate"] = semantic_gate
                  score["pre_claim_gate_quality_score"] = score["quality_score"]
                  score["pre_claim_gate_benefit_score"] = score["benefit_score"]

                  if reliable and (not claim_gate["pass"] or not semantic_gate["pass"]):
          '''
              text = text.replace(old, new, 1)

          old = '''    def _adjustment(self, score: Mapping[str, Any]) -> Dict[str, Any]:
                  claim_gate = score.get("claim_gate")
          '''
          if 'HOLD_TEMPLATE_REPAIR_EVIDENCE' not in text:
              assert old in text
              new = '''    def _adjustment(self, score: Mapping[str, Any]) -> Dict[str, Any]:
                  claim_gate = score.get("claim_gate")
                  semantic_gate = score.get("semantic_gate")
                  if (
                      score.get("runtime_status") == "model_inference"
                      and isinstance(claim_gate, Mapping)
                      and bool(claim_gate.get("pass"))
                      and isinstance(semantic_gate, Mapping)
                      and not bool(semantic_gate.get("pass"))
                  ):
                      previous = self._previous_score(str(score["role"]))
                      if semantic_gate.get("failure_class") == "EVIDENCE_RESOLUTION":
                          action = "HOLD_TEMPLATE_REPAIR_EVIDENCE"
                          instruction = (
                              "Preserve the worker template. The cited immutable source span "
                              "could not be resolved by the evidence plane; repair or narrow the "
                              "registry to a locally resolvable immutable span before judging "
                              "worker semantic performance."
                          )
                      else:
                          action = "TIGHTEN_SEMANTIC_SUPPORT"
                          instruction = (
                              "Narrow each OBSERVED[source-id#span-id] sentence to what the exact "
                              "resolved span supports. If the span contradicts or cannot support "
                              "the claim, reclassify it as INFERENCE or BLOCKED rather than "
                              "stretching the citation."
                          )
                      return {
                          "role": score["role"],
                          "template_id": score["template_id"],
                          "action": action,
                          "instruction": instruction,
                          "quality_before": (
                              round(float(previous["quality_score"]), 2) if previous else None
                          ),
                          "quality_after": score["quality_score"],
                          "benefit_before": (
                              round(float(previous["benefit_score"]), 4) if previous else None
                          ),
                          "benefit_after": score["benefit_score"],
                      }
          '''
              text = text.replace(old, new, 1)

          text = text.replace(
              '| Worker | Quality | Benefit | Claim gate | Source pointer | Benefit delivered | Adjust next |',
              '| Worker | Quality | Benefit | Claim gate | Source pointer | Semantic | Benefit delivered | Adjust next |',
              1,
          )
          text = text.replace(
              '|---|---:|---:|---|---|---|---|',
              '|---|---:|---:|---|---|---|---|---|',
              1,
          )
          old = '            pointer_text = str(gate.get("source_pointer_status") or "N/A")\n'
          if 'semantic_text = str(semantic.get' not in text:
              assert old in text
              text = text.replace(
                  old,
                  old
                  + '            semantic = score.get("semantic_gate", {})\n'
                  + '            semantic_text = str(semantic.get("semantic_support_status") or "N/A")\n',
                  1,
              )
          text = text.replace(
              '                "{benefit_text} | {action} |".format(\n',
              '                "{semantic} | {benefit_text} | {action} |".format(\n',
              1,
          )
          old = '                    pointer=pointer_text,\n'
          if '                    semantic=semantic_text,\n' not in text:
              assert old in text
              text = text.replace(
                  old,
                  old + '                    semantic=semantic_text,\n',
                  1,
              )

          path.write_text(text, encoding='utf-8')
          required = (
              'evaluate_semantic_support',
              'score["semantic_gate"]',
              'TIGHTEN_SEMANTIC_SUPPORT',
              'HOLD_TEMPLATE_REPAIR_EVIDENCE',
              'semantic=semantic_text',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Turn 6 patch incomplete: {missing}')

      - name: Validate targeted Turn 4-6 contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_turn4_evidence_spans tests.test_turn5_semantic_support tests.test_turn6_runtime_semantic_gate
          python scripts/run_turn5_semantic_benchmark.py --output /tmp/turn6-semantic-benchmark.json
          python -m compileall -q .

      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit validated Turn 6 gate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-turn6-runtime-gate.yml
          rm .github/workflows/materialize-turn6-runtime-gate-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add claim_aware_innovation.py .github/workflows/materialize-turn6-runtime-gate.yml .github/workflows/materialize-turn6-runtime-gate-v2.yml
          git diff --cached --check
          git commit -m 'feat: wire semantic support into adaptive worker scoring'
          git push origin HEAD:innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
