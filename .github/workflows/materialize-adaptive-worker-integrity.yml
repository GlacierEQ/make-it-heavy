name: Materialize Adaptive Worker Integrity

on:
  push:
    branches:
      - innovation/adaptive-worker-loop-2026-08-05
    paths:
      - .github/workflows/materialize-adaptive-worker-integrity.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/adaptive-worker-loop-2026-08-05
          fetch-depth: 0

      - name: Preserve Python 3.9 compatibility and install permanent CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('innovation_loop.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Any, Dict, List, Mapping, Optional, Sequence, Tuple',
              'from typing import Any, Dict, List, Mapping, Optional, Sequence, Tuple, Union',
              1,
          )
          text = text.replace(
              'template_path: str | Path,',
              'template_path: Union[str, Path],',
              1,
          )
          if 'str | Path' in text:
              raise SystemExit('Python 3.10-only union syntax remains')
          path.write_text(text, encoding='utf-8')
          PY

          mkdir -p .github/workflows
          cat > .github/workflows/adaptive-worker-integrity.yml <<'YAML'
          name: Adaptive Worker Integrity

          on:
            push:
              branches:
                - main
                - innovation/adaptive-worker-loop-2026-08-05
              paths:
                - 'innovation_loop.py'
                - 'innovation_memory.py'
                - 'adaptive_orchestrator.py'
                - 'make_it_heavy_innovation.py'
                - 'innovation_config.yaml'
                - 'templates/innovation_workers.yaml'
                - 'tests/**'
                - '.github/workflows/adaptive-worker-integrity.yml'
            pull_request:
              paths:
                - 'innovation_loop.py'
                - 'innovation_memory.py'
                - 'adaptive_orchestrator.py'
                - 'make_it_heavy_innovation.py'
                - 'innovation_config.yaml'
                - 'templates/innovation_workers.yaml'
                - 'tests/**'
                - '.github/workflows/adaptive-worker-integrity.yml'

          permissions:
            contents: read

          jobs:
            integrity:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              strategy:
                fail-fast: false
                matrix:
                  python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                - name: Install declared dependencies
                  run: python -m pip install -r requirements.txt
                - name: Compile every Python module
                  run: python -m compileall -q .
                - name: Run complete test suite
                  run: python -m unittest discover -s tests -v
                - name: Verify innovation configuration has no credential
                  run: |
                    python - <<'PY'
                    import yaml
                    config = yaml.safe_load(open('innovation_config.yaml', encoding='utf-8'))
                    assert config['openrouter']['api_key'] == ''
                    assert config['orchestrator']['parallel_agents'] == 8
                    assert len(config['apex_agents']) == 8
                    PY
          YAML

      - name: Commit compatibility repair and permanent CI
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-adaptive-worker-integrity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add innovation_loop.py .github/workflows/adaptive-worker-integrity.yml .github/workflows/materialize-adaptive-worker-integrity.yml
          git diff --cached --check
          git commit -m 'ci: validate adaptive workers on Python 3.9 through 3.13'
          git push origin HEAD:innovation/adaptive-worker-loop-2026-08-05
