name: Materialize Adaptive Worker Compatibility

on:
  push:
    branches:
      - innovation/adaptive-worker-loop-2026-08-05
    paths:
      - .github/workflows/materialize-adaptive-worker-integrity.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/adaptive-worker-loop-2026-08-05
          fetch-depth: 0

      - name: Preserve Python 3.9 compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('innovation_loop.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Any, Dict, List, Mapping, Optional, Sequence, Tuple',
              'from typing import Any, Dict, List, Mapping, Optional, Sequence, Tuple, Union',
              1,
          )
          text = text.replace(
              'template_path: str | Path,',
              'template_path: Union[str, Path],',
              1,
          )
          if 'str | Path' in text:
              raise SystemExit('Python 3.10-only union syntax remains')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit compatibility repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-adaptive-worker-integrity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add innovation_loop.py .github/workflows/materialize-adaptive-worker-integrity.yml
          git diff --cached --check
          git commit -m 'fix: preserve Python 3.9 adaptive worker compatibility'
          git push origin HEAD:innovation/adaptive-worker-loop-2026-08-05
