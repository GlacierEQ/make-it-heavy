name: Activate V2 Runtime Semantic Gate

on:
  push:
    branches:
      - innovation/runtime-v2-semantic-gate-2026-08-07
    paths:
      - .github/workflows/activate-v2-runtime-semantic-gate.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/runtime-v2-semantic-gate-2026-08-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Patch only the semantic evaluator import
        shell: python
        run: |
          from pathlib import Path

          path = Path('claim_aware_innovation.py')
          text = path.read_text(encoding='utf-8')
          old = 'from semantic_support import OBSERVED_LINE_RE, evaluate_observed_claims\n'
          new = (
              'from semantic_support import OBSERVED_LINE_RE\n'
              'from semantic_support_v2_batch import ('
              'evaluate_observed_claims_v2 as evaluate_observed_claims)\n'
          )
          if old not in text:
              raise SystemExit('expected V1 runtime import is missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Expose current-main V2 diagnostics
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -uo pipefail
          echo '=== V1 -> V2 benchmark on current main ==='
          python scripts/run_turn6_semantic_recall.py || benchmark_status=$?
          echo '=== Runtime adapter focused tests ==='
          python -m unittest tests.test_runtime_semantic_v2 -v || adapter_status=$?
          echo "benchmark_status=${benchmark_status:-0} adapter_status=${adapter_status:-0}"
          exit 1
      - name: Commit activation and remove one-shot workflow
        if: false
        run: echo disabled
