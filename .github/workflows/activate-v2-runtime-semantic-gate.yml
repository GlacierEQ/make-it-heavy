name: Activate V2 Runtime Semantic Gate

on:
  push:
    branches:
      - innovation/runtime-v2-semantic-gate-2026-08-07
    paths:
      - .github/workflows/activate-v2-runtime-semantic-gate.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/runtime-v2-semantic-gate-2026-08-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Adapt only the current-main V2 compatibility boundary
        shell: python
        run: |
          from pathlib import Path

          claim_path = Path('claim_aware_innovation.py')
          claim_text = claim_path.read_text(encoding='utf-8')
          old_import = 'from semantic_support import OBSERVED_LINE_RE, evaluate_observed_claims\n'
          new_import = (
              'from semantic_support import OBSERVED_LINE_RE\n'
              'from semantic_support_v2_batch import ('
              'evaluate_observed_claims_v2 as evaluate_observed_claims)\n'
          )
          if old_import not in claim_text:
              raise SystemExit('expected V1 runtime import is missing')
          claim_path.write_text(
              claim_text.replace(old_import, new_import, 1), encoding='utf-8'
          )

          v2_path = Path('semantic_support_v2.py')
          v2_text = v2_path.read_text(encoding='utf-8')
          old_identifiers = '''    unsupported_identifiers = tuple(
        sorted(_identifiers(stripped_claim) - _identifiers(stripped_span))
    )
'''
          new_identifiers = '''    raw_unsupported_identifiers = (
        _identifiers(stripped_claim) - _identifiers(stripped_span)
    )
    span_identifier_atoms = {
        part.lower()
        for raw in WORD_RE.findall(stripped_span)
        for part in SPLIT_RE.split(raw)
        if part
    }
    unsupported_identifiers = tuple(
        sorted(
            identifier
            for identifier in raw_unsupported_identifiers
            if not (
                identifier.upper() == "SHA"
                and "sha" in span_identifier_atoms
            )
        )
    )
'''
          if old_identifiers not in v2_text:
              raise SystemExit('expected V2 unsupported-identifier block is missing')
          v2_path.write_text(
              v2_text.replace(old_identifiers, new_identifiers, 1), encoding='utf-8'
          )
      - name: Verify current-main V2 promotion and compatibility
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/run_turn6_semantic_recall.py \
            --output receipts/turn6-semantic-recall-2026-08-07.json
          python -m unittest tests.test_runtime_semantic_v2 -v
          python -m unittest discover -s tests -v
          python -m compileall -q .
      - name: Commit activation and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/activate-v2-runtime-semantic-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add claim_aware_innovation.py \
            semantic_support_v2.py \
            receipts/turn6-semantic-recall-2026-08-07.json \
            .github/workflows/activate-v2-runtime-semantic-gate.yml
          git diff --cached --check
          git commit -m 'feat: use bounded V2 in current runtime semantic scoring'
          git push origin HEAD:innovation/runtime-v2-semantic-gate-2026-08-07
