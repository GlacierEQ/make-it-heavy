name: Adaptive Innovation Live

on:
  push:
    branches:
      - innovation/adaptive-worker-loop-2026-08-05
    paths:
      - missions/innovation-live.txt
      - .github/workflows/adaptive-innovation-live.yml
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  adaptive-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/adaptive-worker-loop-2026-08-05

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore persistent adaptive memory
        uses: actions/cache@v4
        with:
          path: .swarm_memory.db
          key: adaptive-memory-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            adaptive-memory-${{ runner.os }}-${{ github.ref_name }}-

      - name: Resolve live model plane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            printf '%s\n' '{"provider":"openrouter","selection":"repository-secret","config":"innovation_config.yaml"}' > artifacts/model-plane.json
            echo 'LIVE_CONFIG=innovation_config.yaml' >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "${GITHUB_MODELS_TOKEN:-}" ]; then
            echo 'Neither OPENROUTER_API_KEY nor GitHub Models token is available.' >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          import yaml

          token = os.environ['GITHUB_MODELS_TOKEN']
          request = urllib.request.Request(
              'https://models.github.ai/catalog/models',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2026-03-10',
                  'User-Agent': 'GlacierEQ-Make-It-Heavy/5.0',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              catalog = json.load(response)

          def usable(model):
              capabilities = set(model.get('capabilities') or [])
              outputs = set(model.get('supported_output_modalities') or [])
              return 'tool-calling' in capabilities and 'text' in outputs

          candidates = [model for model in catalog if usable(model)]
          if not candidates:
              raise SystemExit('GitHub Models catalog contains no tool-capable text model for this run')

          preferences = ('OpenAI', 'DeepSeek', 'Meta', 'Microsoft', 'Mistral', 'Cohere')
          selected = []
          used_ids = set()
          for publisher in preferences:
              match = next(
                  (
                      model for model in candidates
                      if publisher.lower() in str(model.get('publisher', '')).lower()
                      and model.get('id') not in used_ids
                  ),
                  None,
              )
              if match:
                  selected.append(match)
                  used_ids.add(match['id'])
              if len(selected) >= 3:
                  break
          for model in candidates:
              if len(selected) >= 3:
                  break
              if model.get('id') not in used_ids:
                  selected.append(model)
                  used_ids.add(model['id'])

          config = yaml.safe_load(Path('innovation_config.yaml').read_text(encoding='utf-8'))
          config['openrouter']['base_url'] = 'https://models.github.ai/inference'
          config['openrouter']['api_key'] = ''
          config['openrouter']['model'] = selected[0]['id']
          for index, profile in enumerate(config['apex_agents']):
              profile['model'] = selected[index % len(selected)]['id']
          Path('innovation_live_config.yaml').write_text(
              yaml.safe_dump(config, sort_keys=False), encoding='utf-8'
          )
          Path('artifacts/model-plane.json').write_text(
              json.dumps(
                  {
                      'provider': 'github-models',
                      'catalog_model_count': len(catalog),
                      'usable_tool_text_model_count': len(candidates),
                      'selected': [
                          {
                              'id': model['id'],
                              'publisher': model.get('publisher'),
                              'capabilities': model.get('capabilities'),
                              'rate_limit_tier': model.get('rate_limit_tier'),
                          }
                          for model in selected
                      ],
                      'selection': 'runtime-catalog-discovery',
                      'config': 'innovation_live_config.yaml',
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          print('Selected GitHub Models:', ', '.join(model['id'] for model in selected))
          PY
          echo "OPENROUTER_API_KEY=$GITHUB_MODELS_TOKEN" >> "$GITHUB_ENV"
          echo 'LIVE_CONFIG=innovation_live_config.yaml' >> "$GITHUB_ENV"

      - name: Run Baseline Zero adaptive mission
        id: mission
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mission="$(cat missions/innovation-live.txt)"
          python make_it_heavy_innovation.py --config "$LIVE_CONFIG" "$mission" | tee artifacts/adaptive-live-output.txt

      - name: Export machine-readable worker receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db = Path('.swarm_memory.db')
          if not db.exists():
              Path('artifacts/adaptive-live-receipt.json').write_text(
                  json.dumps({'status': 'NO_MEMORY_DATABASE'}, indent=2) + '\n',
                  encoding='utf-8',
              )
              raise SystemExit(0)
          conn = sqlite3.connect(str(db))
          conn.row_factory = sqlite3.Row

          mission = conn.execute(
              'SELECT id, mission_hash, query, status, created_at, completed_at '
              'FROM missions ORDER BY id DESC LIMIT 1'
          ).fetchone()
          if mission is None:
              Path('artifacts/adaptive-live-receipt.json').write_text(
                  json.dumps({'status': 'NO_MISSION'}, indent=2) + '\n', encoding='utf-8'
              )
              raise SystemExit(0)
          mission_id = int(mission['id'])

          workers = [dict(row) for row in conn.execute(
              'SELECT worker_id, template_id, template_version, agent_role, model, '
              'runtime_status, quality_score, benefit_score, execution_time, scorecard_json '
              'FROM worker_scores WHERE mission_id = ? ORDER BY worker_id',
              (mission_id,),
          ).fetchall()]
          for worker in workers:
              worker['scorecard'] = json.loads(worker.pop('scorecard_json'))

          adjustments = [dict(row) for row in conn.execute(
              'SELECT agent_role, template_id, action, instruction, quality_before, '
              'quality_after, benefit_before, benefit_after '
              'FROM template_adjustments WHERE mission_id = ? ORDER BY id',
              (mission_id,),
          ).fetchall()]

          topology = conn.execute(
              'SELECT current_worker_count, next_worker_count, reason, report_json '
              'FROM topology_adjustments WHERE mission_id = ? ORDER BY id DESC LIMIT 1',
              (mission_id,),
          ).fetchone()
          topology_value = dict(topology) if topology else None
          if topology_value:
              topology_value['report'] = json.loads(topology_value.pop('report_json'))

          receipt = {
              'schema': 'glaciereq.make-it-heavy.adaptive-live-receipt.v1',
              'mission': dict(mission),
              'worker_count': len(workers),
              'workers': workers,
              'adjustments': adjustments,
              'topology': topology_value,
              'truth_boundary': (
                  'Quality scores measure output-contract performance and benefit scores '
                  'measure marginal contribution. Neither independently proves factual correctness.'
              ),
          }
          Path('artifacts/adaptive-live-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'mission_id': mission_id,
              'worker_count': len(workers),
              'mission_status': mission['status'],
              'next_worker_count': topology_value['next_worker_count'] if topology_value else None,
          }, indent=2))
          PY

      - name: Upload Baseline Zero evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-baseline-zero-${{ github.run_id }}
          path: |
            artifacts/adaptive-live-output.txt
            artifacts/adaptive-live-receipt.json
            artifacts/model-plane.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce mission success
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.mission.outcome }}' != 'success' ]; then
            echo 'Adaptive live mission did not complete successfully.' >&2
            exit 1
          fi
