name: Adaptive Innovation Live

on:
  push:
    branches:
      - innovation/adaptive-worker-loop-2026-08-05
    paths:
      - missions/innovation-live.txt
      - .github/workflows/adaptive-innovation-live.yml
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  adaptive-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/adaptive-worker-loop-2026-08-05

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore clean persistent adaptive memory
        uses: actions/cache@v4
        with:
          path: .swarm_memory.db
          key: adaptive-memory-v2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            adaptive-memory-v2-${{ runner.os }}-${{ github.ref_name }}-

      - name: Resolve live model plane
        id: provider
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          model_id = 'gpt-5'
          config = yaml.safe_load(Path('innovation_config.yaml').read_text(encoding='utf-8'))
          config['openrouter']['base_url'] = 'https://api.openai.com/v1'
          config['openrouter']['api_key'] = ''
          config['openrouter']['model'] = model_id
          for profile in config['apex_agents']:
              profile['model'] = model_id
          Path('innovation_live_config.yaml').write_text(
              yaml.safe_dump(config, sort_keys=False), encoding='utf-8'
          )
          Path('artifacts/model-plane.json').write_text(
              json.dumps({
                  'provider': 'openai',
                  'model': model_id,
                  'selection': 'preferred-live-provider',
                  'model_diversity_controlled': True,
                  'reason': 'Baseline Zero holds model constant to measure worker-template performance.',
                  'config': 'innovation_live_config.yaml',
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
            echo "OPENROUTER_API_KEY=$OPENAI_API_KEY" >> "$GITHUB_ENV"
            echo 'LIVE_PROVIDER=openai' >> "$GITHUB_ENV"
            echo 'LIVE_CONFIG=innovation_live_config.yaml' >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            printf '%s\n' '{"provider":"openrouter","selection":"repository-secret","config":"innovation_config.yaml"}' > artifacts/model-plane.json
            echo 'LIVE_PROVIDER=openrouter' >> "$GITHUB_ENV"
            echo 'LIVE_CONFIG=innovation_config.yaml' >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -n "${GITHUB_MODELS_TOKEN:-}" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          model_id = 'openai/gpt-4o'
          config = yaml.safe_load(Path('innovation_config.yaml').read_text(encoding='utf-8'))
          config['openrouter']['base_url'] = 'https://models.github.ai/inference'
          config['openrouter']['api_key'] = ''
          config['openrouter']['model'] = model_id
          for profile in config['apex_agents']:
              profile['model'] = model_id
          Path('innovation_live_config.yaml').write_text(
              yaml.safe_dump(config, sort_keys=False), encoding='utf-8'
          )
          Path('artifacts/model-plane.json').write_text(
              json.dumps({
                  'provider': 'github-models',
                  'model': model_id,
                  'selection': 'actions-native-fallback',
                  'model_diversity_controlled': True,
                  'reason': 'GitHub Actions GITHUB_TOKEN with models: read; same model across workers isolates template performance.',
                  'config': 'innovation_live_config.yaml',
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
            echo "OPENROUTER_API_KEY=$GITHUB_MODELS_TOKEN" >> "$GITHUB_ENV"
            echo 'LIVE_PROVIDER=github-models' >> "$GITHUB_ENV"
            echo 'LIVE_CONFIG=innovation_live_config.yaml' >> "$GITHUB_ENV"
            exit 0
          fi

          printf '%s\n' '{"provider":null,"status":"NO_LIVE_PROVIDER","detail":"No usable live inference identity is available."}' > artifacts/model-plane.json
          echo 'No live model-provider identity is available.' >&2
          exit 1

      - name: Diagnose resolved inference plane
        id: preflight
        if: steps.provider.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml
          from agent import OpenAI

          config = yaml.safe_load(Path(os.environ['LIVE_CONFIG']).read_text(encoding='utf-8'))
          base_url = config['openrouter']['base_url'].rstrip('/')
          model = config['openrouter']['model']
          token = os.environ['OPENROUTER_API_KEY']
          diagnostics = {
              'provider': os.environ.get('LIVE_PROVIDER'),
              'base_url': base_url,
              'model': model,
              'checks': [],
          }

          def record(name, fn):
              try:
                  value = fn()
                  diagnostics['checks'].append({'name': name, 'status': 'PASS', 'detail': value})
                  return True
              except Exception as exc:
                  diagnostics['checks'].append({
                      'name': name,
                      'status': 'FAIL',
                      'error_type': type(exc).__name__,
                      'detail': str(exc)[:2000],
                  })
                  return False

          def client_plain():
              client = OpenAI(base_url, token, 45)
              response = client.chat.completions.create(
                  model=model,
                  messages=[{'role': 'user', 'content': 'Reply with exactly READY.'}],
              )
              return (response.choices[0].message.content or '')[:200]

          def client_tool():
              client = OpenAI(base_url, token, 45)
              response = client.chat.completions.create(
                  model=model,
                  messages=[{'role': 'user', 'content': 'Use the ping tool once.'}],
                  tools=[{
                      'type': 'function',
                      'function': {
                          'name': 'ping',
                          'description': 'Return a simple test value.',
                          'parameters': {
                              'type': 'object',
                              'properties': {},
                              'additionalProperties': False,
                          },
                      },
                  }],
              )
              message = response.choices[0].message
              return {
                  'content': message.content,
                  'tool_call_count': len(message.tool_calls or []),
              }

          checks = [
              record('make_it_heavy_client_plain', client_plain),
              record('make_it_heavy_client_tool', client_tool),
          ]
          diagnostics['status'] = 'PASS' if all(checks) else 'FAIL'
          Path('artifacts/provider-diagnostics.json').write_text(
              json.dumps(diagnostics, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(diagnostics, indent=2, sort_keys=True))
          if not all(checks):
              raise SystemExit(1)
          PY

      - name: Run Baseline Zero adaptive mission
        id: mission
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mission="$(cat missions/innovation-live.txt)"
          python make_it_heavy_innovation.py --config "$LIVE_CONFIG" "$mission" | tee artifacts/adaptive-live-output.txt

      - name: Export machine-readable worker receipt
        id: receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db = Path('.swarm_memory.db')
          if not db.exists():
              Path('artifacts/adaptive-live-receipt.json').write_text(
                  json.dumps({'status': 'NO_MEMORY_DATABASE'}, indent=2) + '\n', encoding='utf-8'
              )
              print('HEALTHY_WORKERS=0')
              raise SystemExit(0)
          conn = sqlite3.connect(str(db))
          conn.row_factory = sqlite3.Row
          mission = conn.execute(
              'SELECT id, mission_hash, query, status, created_at, completed_at '
              'FROM missions ORDER BY id DESC LIMIT 1'
          ).fetchone()
          if mission is None:
              Path('artifacts/adaptive-live-receipt.json').write_text(
                  json.dumps({'status': 'NO_MISSION'}, indent=2) + '\n', encoding='utf-8'
              )
              print('HEALTHY_WORKERS=0')
              raise SystemExit(0)
          mission_id = int(mission['id'])
          workers = [dict(row) for row in conn.execute(
              'SELECT worker_id, template_id, template_version, agent_role, model, '
              'runtime_status, quality_score, benefit_score, execution_time, scorecard_json '
              'FROM worker_scores WHERE mission_id = ? ORDER BY worker_id',
              (mission_id,),
          ).fetchall()]
          for worker in workers:
              worker['scorecard'] = json.loads(worker.pop('scorecard_json'))
          healthy_workers = sum(1 for worker in workers if worker['runtime_status'] == 'model_inference')
          adjustments = [dict(row) for row in conn.execute(
              'SELECT agent_role, template_id, action, instruction, quality_before, '
              'quality_after, benefit_before, benefit_after '
              'FROM template_adjustments WHERE mission_id = ? ORDER BY id',
              (mission_id,),
          ).fetchall()]
          topology = conn.execute(
              'SELECT current_worker_count, next_worker_count, reason, report_json '
              'FROM topology_adjustments WHERE mission_id = ? ORDER BY id DESC LIMIT 1',
              (mission_id,),
          ).fetchone()
          topology_value = dict(topology) if topology else None
          if topology_value:
              topology_value['report'] = json.loads(topology_value.pop('report_json'))
          receipt = {
              'schema': 'glaciereq.make-it-heavy.adaptive-live-receipt.v2',
              'mission': dict(mission),
              'worker_count': len(workers),
              'healthy_worker_count': healthy_workers,
              'workers': workers,
              'adjustments': adjustments,
              'topology': topology_value,
              'truth_boundary': (
                  'Quality scores measure output-contract performance and benefit scores '
                  'measure marginal contribution. Neither independently proves factual correctness.'
              ),
          }
          Path('artifacts/adaptive-live-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('artifacts/worker-health.env').write_text(
              f'HEALTHY_WORKERS={healthy_workers}\n', encoding='utf-8'
          )
          print(json.dumps({
              'mission_id': mission_id,
              'worker_count': len(workers),
              'healthy_worker_count': healthy_workers,
              'mission_status': mission['status'],
              'next_worker_count': topology_value['next_worker_count'] if topology_value else None,
          }, indent=2))
          PY

      - name: Upload Baseline Zero evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-baseline-zero-${{ github.run_id }}
          path: |
            artifacts/adaptive-live-output.txt
            artifacts/adaptive-live-receipt.json
            artifacts/model-plane.json
            artifacts/provider-diagnostics.json
            artifacts/worker-health.env
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce live-run health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.provider.outcome }}' != 'success' ]; then
            echo 'No live provider is configured; worker templates were not evaluated.' >&2
            exit 1
          fi
          if [ '${{ steps.preflight.outcome }}' != 'success' ]; then
            echo 'Inference-plane preflight failed; worker templates were not evaluated.' >&2
            exit 1
          fi
          if [ '${{ steps.mission.outcome }}' != 'success' ]; then
            echo 'Adaptive live mission did not complete successfully.' >&2
            exit 1
          fi
          if [ ! -f artifacts/worker-health.env ]; then
            echo 'Worker health receipt is missing.' >&2
            exit 1
          fi
          source artifacts/worker-health.env
          if [ "${HEALTHY_WORKERS:-0}" -lt 1 ]; then
            echo 'Adaptive turn produced zero reviewable workers; refusing false-green completion.' >&2
            exit 1
          fi
