name: Materialize Turn 6 Health Isolation V3

on:
  push:
    branches:
      - innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
    paths:
      - .github/workflows/materialize-turn6-health-isolation-v3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Patch health isolation deterministically
        shell: python
        run: |
          from pathlib import Path

          path = Path('adaptive_orchestrator.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from innovation_memory import AdaptiveSwarmMemory\n'
          if 'from health_memory import HealthAwareAdaptiveSwarmMemory' not in text:
              if old_import not in text:
                  raise SystemExit('memory import anchor missing')
              text = text.replace(
                  old_import,
                  'from health_memory import HealthAwareAdaptiveSwarmMemory\n'
                  'from innovation_health import (\n'
                  '    build_infrastructure_report,\n'
                  '    classify_shared_infrastructure_failure,\n'
                  ')\n',
                  1,
              )

          old_memory = '        self.memory = AdaptiveSwarmMemory(memory_path)\n'
          if 'self.memory = HealthAwareAdaptiveSwarmMemory(memory_path)' not in text:
              if old_memory not in text:
                  raise SystemExit('memory constructor anchor missing')
              text = text.replace(
                  old_memory,
                  '        self.memory = HealthAwareAdaptiveSwarmMemory(memory_path)\n',
                  1,
              )

          if '    def _persist_infrastructure_turn(' not in text:
              marker = '    def orchestrate(self, user_input: str) -> str:\n'
              if marker not in text:
                  raise SystemExit('orchestrate marker missing')
              persist_method = (
                  '    def _persist_infrastructure_turn(\n'
                  '        self,\n'
                  '        user_input: str,\n'
                  '        incident: Dict[str, Any],\n'
                  '    ) -> Dict[str, Any]:\n'
                  '        """Persist shared-runtime failure without teaching worker templates from it."""\n'
                  '\n'
                  '        report = build_infrastructure_report(\n'
                  '            self._current_mission_id,\n'
                  '            user_input,\n'
                  '            self.last_run_results,\n'
                  '            self.innovation,\n'
                  '            self.worker_profiles,\n'
                  '            incident,\n'
                  '        )\n'
                  '        self.memory.persist_adaptive_turn(\n'
                  '            self._current_mission_id,\n'
                  '            report["scores"],\n'
                  '            report["adjustments"],\n'
                  '            report["current_worker_count"],\n'
                  '            report["next_worker_count"],\n'
                  '            report["topology_reason"],\n'
                  '            report,\n'
                  '        )\n'
                  '        return report\n'
                  '\n'
              )
              text = text.replace(marker, persist_method + marker, 1)

          if 'classify_shared_infrastructure_failure(self.last_run_results)' not in text:
              synthesis_anchor = '            synthesis = self._run_bounded_worker_set(user_input)\n'
              if synthesis_anchor not in text:
                  raise SystemExit('bounded synthesis anchor missing')
              incident_block = (
                  '            incident = classify_shared_infrastructure_failure(\n'
                  '                self.last_run_results\n'
                  '            )\n'
                  '            if incident is not None:\n'
                  '                report = self._persist_infrastructure_turn(user_input, incident)\n'
                  '                report["provider_concurrency_width"] = bounded_provider_concurrency(\n'
                  '                    self.num_agents,\n'
                  '                    self.provider_concurrency_width,\n'
                  '                )\n'
                  '                self.last_innovation_report = report\n'
                  '                final = f"{synthesis}\\n\\n{report[\'markdown\']}"\n'
                  '                self.memory.complete_mission(\n'
                  '                    self._current_mission_id,\n'
                  '                    final,\n'
                  '                    status="infra_failed",\n'
                  '                )\n'
                  '                self._activate_next_roles(report["next_roles"])\n'
                  '                return final\n'
              )
              text = text.replace(synthesis_anchor, synthesis_anchor + incident_block, 1)

          path.write_text(text, encoding='utf-8')
          for needle in (
              'HealthAwareAdaptiveSwarmMemory',
              'classify_shared_infrastructure_failure(self.last_run_results)',
              '_persist_infrastructure_turn',
              'status="infra_failed"',
              'provider_concurrency_width',
          ):
              if needle not in text:
                  raise SystemExit(f'health integration missing: {needle}')

      - name: Validate health and semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_innovation_health \
            tests.test_turn4_evidence_spans \
            tests.test_turn5_semantic_support \
            tests.test_turn6_runtime_semantic_gate
          python scripts/run_turn5_semantic_benchmark.py \
            --output /tmp/turn6-semantic-benchmark.json
          python -m compileall -q .

      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit validated health integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-turn6-health-isolation.yml
          rm -f .github/workflows/materialize-turn6-health-isolation-v2.yml
          rm .github/workflows/materialize-turn6-health-isolation-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            adaptive_orchestrator.py \
            .github/workflows/materialize-turn6-health-isolation.yml \
            .github/workflows/materialize-turn6-health-isolation-v2.yml \
            .github/workflows/materialize-turn6-health-isolation-v3.yml
          git diff --cached --check
          git commit -m 'feat: isolate shared runtime failures from worker learning'
          git push origin HEAD:innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
