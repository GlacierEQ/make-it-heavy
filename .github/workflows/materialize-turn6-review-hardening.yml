name: Materialize Turn 6 Review Hardening

on:
  push:
    branches:
      - innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
    paths:
      - .github/workflows/materialize-turn6-review-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Anchor resolver and render infra classification honestly
        shell: python
        run: |
          from pathlib import Path

          claim_path = Path('claim_aware_innovation.py')
          claim = claim_path.read_text(encoding='utf-8')
          old = '        self.span_resolver = span_resolver or LocalGitImmutableSpanResolver()\n'
          new = (
              '        evidence_repo_root = LocalGitImmutableSpanResolver.discover_repo_root(\n'
              '            self.template_path\n'
              '        )\n'
              '        self.span_resolver = span_resolver or LocalGitImmutableSpanResolver(\n'
              '            evidence_repo_root\n'
              '        )\n'
          )
          if old not in claim:
              raise SystemExit('claim-aware resolver anchor missing')
          claim_path.write_text(claim.replace(old, new, 1), encoding='utf-8')

          orchestrator_path = Path('adaptive_orchestrator.py')
          orchestrator = orchestrator_path.read_text(encoding='utf-8')
          old_import = (
              'from innovation_health import (\n'
              '    build_infrastructure_report,\n'
              '    classify_shared_infrastructure_failure,\n'
              ')\n'
          )
          new_import = (
              'from innovation_health import (\n'
              '    build_infrastructure_report,\n'
              '    classify_shared_infrastructure_failure,\n'
              '    render_infrastructure_result,\n'
              ')\n'
          )
          if old_import not in orchestrator:
              raise SystemExit('innovation-health import anchor missing')
          orchestrator = orchestrator.replace(old_import, new_import, 1)
          old_final = '                final = f"{synthesis}\\n\\n{report[\'markdown\']}"\n'
          new_final = '                final = render_infrastructure_result(report)\n'
          if old_final not in orchestrator:
              raise SystemExit('infra final-result anchor missing')
          orchestrator_path.write_text(
              orchestrator.replace(old_final, new_final, 1), encoding='utf-8'
          )

      - name: Run Turn 6 focused regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_innovation_health \
            tests.test_turn4_evidence_spans \
            tests.test_turn5_semantic_support \
            tests.test_turn6_runtime_semantic_gate
          python scripts/run_turn5_semantic_benchmark.py \
            --output /tmp/turn6-semantic-benchmark.json
          python -m compileall -q .

      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit only after every gate is green
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-turn6-review-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add claim_aware_innovation.py adaptive_orchestrator.py .github/workflows/materialize-turn6-review-hardening.yml
          git diff --cached --check
          git commit -m 'fix: close Turn 6 semantic and infrastructure review gaps'
          git push origin HEAD:innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
