name: Materialize Capacity-Aware Adaptation

on:
  push:
    branches:
      - innovation/adaptive-worker-loop-2026-08-05
    paths:
      - .github/workflows/materialize-capacity-aware-adaptation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/adaptive-worker-loop-2026-08-05
          fetch-depth: 0

      - name: Apply capacity-aware controller patch
        run: python scripts/materialize_capacity_adaptation.py

      - name: Validate patched runtime
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m pytest -q tests/test_innovation_health.py tests/test_capacity_adaptation.py tests/test_adaptive_workers.py

      - name: Commit validated patch and remove one-shot materializer
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-capacity-aware-adaptation.yml
          rm scripts/materialize_capacity_adaptation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            innovation_health.py \
            orchestrator.py \
            adaptive_orchestrator.py \
            innovation_loop.py \
            tests/test_capacity_adaptation.py \
            .github/workflows/adaptive-innovation-live.yml \
            .github/workflows/materialize-capacity-aware-adaptation.yml \
            scripts/materialize_capacity_adaptation.py
          git diff --cached --check
          git commit -m 'feat: separate worker topology from execution capacity'
          git push origin HEAD:innovation/adaptive-worker-loop-2026-08-05
