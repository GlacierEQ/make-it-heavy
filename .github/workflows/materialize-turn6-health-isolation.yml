name: Materialize Turn 6 Health Isolation

on:
  push:
    branches:
      - innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
    paths:
      - .github/workflows/materialize-turn6-health-isolation.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Patch health isolation into bounded-concurrency orchestrator
        shell: python
        run: |
          from pathlib import Path

          path = Path('adaptive_orchestrator.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from innovation_memory import AdaptiveSwarmMemory\n'
          new_import = (
              'from health_memory import HealthAwareAdaptiveSwarmMemory\n'
              'from innovation_health import (\n'
              '    build_infrastructure_report,\n'
              '    classify_shared_infrastructure_failure,\n'
              ')\n'
          )
          if 'HealthAwareAdaptiveSwarmMemory' not in text:
              if old_import not in text:
                  raise SystemExit('memory import anchor missing')
              text = text.replace(old_import, new_import, 1)

          old_memory = '        self.memory = AdaptiveSwarmMemory(memory_path)\n'
          if 'self.memory = HealthAwareAdaptiveSwarmMemory(memory_path)' not in text:
              if old_memory not in text:
                  raise SystemExit('memory constructor anchor missing')
              text = text.replace(
                  old_memory,
                  '        self.memory = HealthAwareAdaptiveSwarmMemory(memory_path)\n',
                  1,
              )

          persist_method = '''    def _persist_infrastructure_turn(
                  self,
                  user_input: str,
                  incident: Dict[str, Any],
              ) -> Dict[str, Any]:
                  """Persist shared-runtime failure without teaching worker templates from it."""

                  report = build_infrastructure_report(
                      self._current_mission_id,
                      user_input,
                      self.last_run_results,
                      self.innovation,
                      self.worker_profiles,
                      incident,
                  )
                  self.memory.persist_adaptive_turn(
                      self._current_mission_id,
                      report["scores"],
                      report["adjustments"],
                      report["current_worker_count"],
                      report["next_worker_count"],
                      report["topology_reason"],
                      report,
                  )
                  return report

          '''
          if '    def _persist_infrastructure_turn(' not in text:
              marker = '    def orchestrate(self, user_input: str) -> str:\n'
              if marker not in text:
                  raise SystemExit('orchestrate marker missing')
              text = text.replace(marker, persist_method + marker, 1)

          old_sequence = '''            synthesis = self._run_bounded_worker_set(user_input)
                  report = self.innovation.evaluate_turn(
          '''
          if 'classify_shared_infrastructure_failure(self.last_run_results)' not in text:
              if old_sequence not in text:
                  raise SystemExit('post-run scoring anchor missing')
              new_sequence = '''            synthesis = self._run_bounded_worker_set(user_input)
                  incident = classify_shared_infrastructure_failure(self.last_run_results)
                  if incident is not None:
                      report = self._persist_infrastructure_turn(user_input, incident)
                      report["provider_concurrency_width"] = bounded_provider_concurrency(
                          self.num_agents,
                          self.provider_concurrency_width,
                      )
                      self.last_innovation_report = report
                      final = f"{synthesis}\\n\\n{report['markdown']}"
                      self.memory.complete_mission(
                          self._current_mission_id,
                          final,
                          status="infra_failed",
                      )
                      self._activate_next_roles(report["next_roles"])
                      return final

                  report = self.innovation.evaluate_turn(
          '''
              text = text.replace(old_sequence, new_sequence, 1)

          normal_anchor = '''            report["provider_concurrency_width"] = bounded_provider_concurrency(
          '''
          if 'report["health_class"] = "HEALTHY_OR_MIXED"' not in text:
              if normal_anchor not in text:
                  raise SystemExit('normal report anchor missing')
              text = text.replace(
                  normal_anchor,
                  '            report["health_class"] = "HEALTHY_OR_MIXED"\n'
                  '            report["performance_valid"] = True\n'
                  + normal_anchor,
                  1,
              )

          path.write_text(text, encoding='utf-8')
          for needle in (
              'HealthAwareAdaptiveSwarmMemory',
              'classify_shared_infrastructure_failure(self.last_run_results)',
              '_persist_infrastructure_turn',
              'status="infra_failed"',
              'provider_concurrency_width',
          ):
              if needle not in text:
                  raise SystemExit(f'health integration missing: {needle}')

      - name: Validate health and semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_innovation_health \
            tests.test_turn4_evidence_spans \
            tests.test_turn5_semantic_support \
            tests.test_turn6_runtime_semantic_gate
          python scripts/run_turn5_semantic_benchmark.py \
            --output /tmp/turn6-semantic-benchmark.json
          python -m compileall -q .

      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit validated health integration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-turn6-health-isolation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adaptive_orchestrator.py .github/workflows/materialize-turn6-health-isolation.yml
          git diff --cached --check
          git commit -m 'feat: isolate infrastructure failures from worker learning'
          git push origin HEAD:innovation/worker-turn-06-runtime-semantic-gate-2026-08-07
