name: Materialize Worker Baseline Zero

on:
  push:
    branches:
      - innovation/adaptive-worker-loop-2026-08-05
    paths:
      - scripts/harden_and_run_worker_baseline_zero.py
      - .github/workflows/execute-worker-baseline-zero.yml

permissions:
  contents: write

concurrency:
  group: worker-baseline-zero
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out adaptive worker branch
        uses: actions/checkout@v4
        with:
          ref: innovation/adaptive-worker-loop-2026-08-05
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared runtime
        run: python -m pip install -r requirements.txt

      - name: Harden reviewed adaptive contracts
        run: |
          set -euo pipefail
          python scripts/harden_and_run_worker_baseline_zero.py harden
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('tests/test_adaptive_hardening.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(\s*)config\[["\x27]memory["\x27]\]\[["\x27]db_path["\x27]\].*\n'
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('hardening-test db-path assignment missing')
          indent = match.group(1)
          addition = (
              match.group(0)
              + indent
              + "config['innovation']['template_path'] = "
              + "str(ROOT / 'templates/innovation_workers.yaml')\n"
          )
          path.write_text(pattern.sub(addition, text, count=1), encoding='utf-8')
          PY

      - name: Fetch genuine SparkForge receipt
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            'https://kjebemdgvjvuutzvhbtp.supabase.co/functions/v1/mih-worker-baseline-zero' \
            --output /tmp/worker-baseline-zero.json

      - name: Materialize worker outputs and receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          row = json.loads(Path('/tmp/worker-baseline-zero.json').read_text(encoding='utf-8'))
          result = row.get('result') or {}
          assert row.get('status') == 'PASS', row
          assert result.get('status') == 'PASS', result
          assert result.get('provider') == 'henry-ships-sparkforge.smart_summarize'
          assert result.get('provider_count') == 1
          assert result.get('worker_count') == 8
          assert result.get('silent_worker_omissions') == 0
          assert len(result.get('scores', [])) == 8
          assert all(item.get('runtime_status') == 'model_inference' for item in result['scores'])
          assert len(result.get('adjustments', [])) == 8
          assert len(result.get('next_roles', [])) == result.get('next_worker_count')

          output_dir = Path('artifacts/worker-baseline-zero')
          output_dir.mkdir(parents=True, exist_ok=True)
          receipts = Path('receipts')
          receipts.mkdir(parents=True, exist_ok=True)

          mission = str(result['mission']).rstrip() + '\n'
          (output_dir / 'mission.md').write_text(mission, encoding='utf-8')
          (output_dir / 'worker-report.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          raw_blocks = ['# Worker Baseline Zero — Raw Genuine Outputs', '']
          for score in result['scores']:
              raw_blocks.extend([
                  f"## {score['role']}",
                  '',
                  f"- Provider: `{score['model']}`",
                  f"- Quality: **{score['quality_score']:.2f}/100**",
                  f"- Marginal benefit: **{score['benefit_score']:.4f}**",
                  f"- Execution time: **{score['execution_time']:.3f}s**",
                  f"- Response SHA-256: `{score['response_sha256']}`",
                  '',
                  str(score['output']).rstrip(),
                  '',
              ])
          (output_dir / 'raw-worker-outputs.md').write_text(
              '\n'.join(raw_blocks).rstrip() + '\n',
              encoding='utf-8',
          )

          adjustment_by_role = {
              item['role']: item for item in result['adjustments']
          }
          table_rows = []
          for score in result['scores']:
              adjustment = adjustment_by_role[score['role']]
              table_rows.append(
                  f"| `{score['role']}` | {score['quality_score']:.2f} | "
                  f"{score['benefit_score']:.4f} | `{adjustment['action']}` |"
              )
          summary = '\n'.join([
              '# Worker Baseline Zero',
              '',
              f"- Genuine workers executed: **{result['worker_count']}**",
              f"- Provider: **{result['provider']}**",
              f"- Independent providers: **{result['provider_count']}**",
              f"- Average quality: **{result['average_quality']:.2f}/100**",
              f"- Average marginal benefit: **{result['average_benefit']:.4f}**",
              f"- Next worker count: **{result['next_worker_count']}**",
              f"- Topology decision: {result['topology_reason']}",
              '',
              '| Worker | Quality | Benefit | Next adjustment |',
              '|---|---:|---:|---|',
              *table_rows,
              '',
              '## Next active roles',
              '',
              ', '.join(f"`{role}`" for role in result['next_roles']),
              '',
              '## Truth boundary',
              '',
              str(result['truth_boundary']),
              '',
              f"Result SHA-256: `{row['result_sha256']}`",
          ])
          (output_dir / 'summary.md').write_text(summary + '\n', encoding='utf-8')

          artifact_hashes = {}
          for path in sorted(output_dir.iterdir()):
              artifact_hashes[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          receipt = {
              'schema': 'glaciereq.make-it-heavy.worker-baseline-zero-receipt.v1',
              'run_id': row['run_id'],
              'status': 'PASS',
              'provider': result['provider'],
              'provider_count': result['provider_count'],
              'worker_count': result['worker_count'],
              'genuine_external_model_executions': result['worker_count'],
              'silent_worker_omissions': result['silent_worker_omissions'],
              'average_quality': result['average_quality'],
              'average_benefit': result['average_benefit'],
              'next_worker_count': result['next_worker_count'],
              'next_roles': result['next_roles'],
              'result_sha256': row['result_sha256'],
              'artifact_sha256': artifact_hashes,
              'worker_response_sha256': {
                  score['role']: score['response_sha256']
                  for score in result['scores']
              },
              'truth_boundary': result['truth_boundary'],
              'multi_provider_consensus': False,
          }
          (receipts / 'worker-baseline-zero-2026-08-05.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'status': receipt['status'],
              'workers': receipt['worker_count'],
              'average_quality': receipt['average_quality'],
              'average_benefit': receipt['average_benefit'],
              'next_worker_count': receipt['next_worker_count'],
              'result_sha256': receipt['result_sha256'],
          }, indent=2))
          PY

      - name: Validate hardened runtime and receipt
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path('receipts/worker-baseline-zero-2026-08-05.json').read_text()
          )
          assert receipt['status'] == 'PASS'
          assert receipt['provider_count'] == 1
          assert receipt['worker_count'] == 8
          assert receipt['genuine_external_model_executions'] == 8
          assert receipt['silent_worker_omissions'] == 0
          assert receipt['multi_provider_consensus'] is False
          assert len(receipt['worker_response_sha256']) == 8
          PY

      - name: Commit hardening and genuine worker artifacts
        run: |
          set -euo pipefail
          rm .github/workflows/execute-worker-baseline-zero.yml
          rm scripts/harden_and_run_worker_baseline_zero.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            innovation_loop.py \
            innovation_memory.py \
            adaptive_orchestrator.py \
            make_it_heavy_innovation.py \
            innovation_config.yaml \
            templates/innovation_workers.yaml \
            docs/ADAPTIVE_WORKER_INNOVATION_LOOP.md \
            requirements.txt \
            tests/test_adaptive_hardening.py \
            .github/workflows/adaptive-worker-integrity.yml \
            artifacts/worker-baseline-zero \
            receipts/worker-baseline-zero-2026-08-05.json \
            .github/workflows/execute-worker-baseline-zero.yml \
            scripts/harden_and_run_worker_baseline_zero.py
          git diff --cached --check
          git commit -m 'feat: execute and tune Worker Baseline Zero'
          git push origin HEAD:innovation/adaptive-worker-loop-2026-08-05
