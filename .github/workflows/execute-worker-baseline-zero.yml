name: Execute Worker Baseline Zero

on:
  push:
    branches:
      - innovation/adaptive-worker-loop-2026-08-05
    paths:
      - scripts/harden_and_run_worker_baseline_zero.py
      - .github/workflows/execute-worker-baseline-zero.yml

permissions:
  contents: write
  models: read

concurrency:
  group: worker-baseline-zero
  cancel-in-progress: false

jobs:
  harden-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out adaptive worker branch
        uses: actions/checkout@v4
        with:
          ref: innovation/adaptive-worker-loop-2026-08-05
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared runtime
        run: python -m pip install -r requirements.txt

      - name: Harden reviewed adaptive contracts
        run: |
          set -euo pipefail
          python scripts/harden_and_run_worker_baseline_zero.py harden
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('tests/test_adaptive_hardening.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(\s*)config\[["\x27]memory["\x27]\]\[["\x27]db_path["\x27]\].*\n'
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('hardening-test db-path assignment missing')
          indent = match.group(1)
          addition = (
              match.group(0)
              + indent
              + "config['innovation']['template_path'] = "
              + "str(ROOT / 'templates/innovation_workers.yaml')\n"
          )
          path.write_text(pattern.sub(addition, text, count=1), encoding='utf-8')

          runner = Path('scripts/harden_and_run_worker_baseline_zero.py')
          source = runner.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(\s+if len\(report\.get\("scores", \[\]\)\) != 8:\n'
              r'\s+raise RuntimeError\("baseline did not produce exactly eight worker scorecards"\)\n)'
          )
          match = pattern.search(source)
          if not match:
              raise SystemExit('baseline-success assertion missing')
          extra = "\n".join([
              '    failed = [',
              '        score["role"] for score in report["scores"]',
              '        if score.get("runtime_status") != "model_inference"',
              '    ]',
              '    if failed:',
              '        raise RuntimeError(f"baseline workers failed: {failed}")',
              '',
          ])
          runner.write_text(
              pattern.sub(match.group(1) + extra, source, count=1),
              encoding='utf-8',
          )
          PY

      - name: Validate hardened runtime before model execution
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Run eight live innovation workers and synthesis
        env:
          OPENROUTER_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/harden_and_run_worker_baseline_zero.py baseline

      - name: Verify Baseline Zero receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('receipts/worker-baseline-zero-2026-08-05.json').read_text())
          report = json.loads(Path('artifacts/worker-baseline-zero/worker-report.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['provider'] == 'GitHub Models'
          assert receipt['worker_count'] == 8
          assert receipt['silent_worker_omissions'] == 0
          assert len(report['scores']) == 8
          assert all(score['runtime_status'] == 'model_inference' for score in report['scores'])
          assert len(report['adjustments']) == 8
          assert len(report['next_roles']) == report['next_worker_count']
          print(json.dumps({
              'status': 'PASS',
              'workers': receipt['worker_count'],
              'average_quality': receipt['average_quality'],
              'average_benefit': receipt['average_benefit'],
              'next_worker_count': receipt['next_worker_count'],
              'next_roles': receipt['next_roles'],
          }, indent=2))
          PY

      - name: Commit hardening and genuine worker receipt
        run: |
          set -euo pipefail
          rm .github/workflows/execute-worker-baseline-zero.yml
          rm scripts/harden_and_run_worker_baseline_zero.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            innovation_loop.py \
            innovation_memory.py \
            adaptive_orchestrator.py \
            make_it_heavy_innovation.py \
            innovation_config.yaml \
            templates/innovation_workers.yaml \
            docs/ADAPTIVE_WORKER_INNOVATION_LOOP.md \
            requirements.txt \
            tests/test_adaptive_hardening.py \
            .github/workflows/adaptive-worker-integrity.yml \
            artifacts/worker-baseline-zero \
            receipts/worker-baseline-zero-2026-08-05.json \
            .github/workflows/execute-worker-baseline-zero.yml \
            scripts/harden_and_run_worker_baseline_zero.py
          git diff --cached --check
          git commit -m 'feat: execute and tune Worker Baseline Zero'
          git push origin HEAD:innovation/adaptive-worker-loop-2026-08-05
