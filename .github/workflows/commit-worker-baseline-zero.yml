name: Commit Worker Baseline Zero

on:
  push:
    branches:
      - innovation/adaptive-worker-loop-2026-08-05
    paths:
      - .github/workflows/commit-worker-baseline-zero.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: innovation/adaptive-worker-loop-2026-08-05
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime
        run: python -m pip install -r requirements.txt

      - name: Harden and materialize
        run: |
          set -euo pipefail
          python scripts/harden_and_run_worker_baseline_zero.py harden
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('tests/test_adaptive_hardening.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(\s*)config\[["\x27]memory["\x27]\]\[["\x27]db_path["\x27]\].*\n'
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('hardening test db path missing')
          indent = match.group(1)
          addition = (
              match.group(0)
              + indent
              + "config['innovation']['template_path'] = "
              + "str(ROOT / 'templates/innovation_workers.yaml')\n"
          )
          path.write_text(pattern.sub(addition, text, count=1), encoding='utf-8')
          PY
          python scripts/materialize_worker_baseline_zero.py

      - name: Validate
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit non-workflow changes
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/adaptive-worker-integrity.yml
          rm -f .swarm_memory.db
          rm scripts/harden_and_run_worker_baseline_zero.py
          rm scripts/materialize_worker_baseline_zero.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            innovation_loop.py \
            innovation_memory.py \
            adaptive_orchestrator.py \
            make_it_heavy_innovation.py \
            innovation_config.yaml \
            templates/innovation_workers.yaml \
            docs/ADAPTIVE_WORKER_INNOVATION_LOOP.md \
            requirements.txt \
            tests/test_adaptive_hardening.py \
            artifacts/worker-baseline-zero \
            receipts/worker-baseline-zero-2026-08-05.json \
            scripts/harden_and_run_worker_baseline_zero.py \
            scripts/materialize_worker_baseline_zero.py
          git diff --cached --check
          git commit -m 'feat: execute and tune Worker Baseline Zero'
          git push origin HEAD:innovation/adaptive-worker-loop-2026-08-05
