# Make-It-Heavy v4.0 — write-capable swarm with persistent memory and opt-in MCP connectors.
# Prefer setting OPENROUTER_API_KEY and SMITHERY_KEY in the environment. Do not commit credentials.

openrouter:
  api_key: ""
  base_url: "https://openrouter.ai/api/v1"
  model: "openai/gpt-4.1-mini"
  request_timeout: 45

memory:
  db_path: ".swarm_memory.db"
  enabled: true
  recall_similar_on_start: true

# Smithery is implemented but deliberately disabled by the base tool policy below.
# To enable it for a deployment, configure exact connection IDs here, then add
# smithery_mcp to both the global allowlist and only the worker roles that need it.
# The connector is privileged and also requires tools.mutation_enabled: true.
smithery:
  api_key: ""  # Set via SMITHERY_KEY env var
  namespace_url: "https://mcp.smithery.run/GlacierEQ"
  allowed_connections: []
  request_timeout: 60

scheduler:
  enabled: false
  default_interval: "every().hour"

system_prompt: |
  You are a write-capable, policy-bound swarm worker. Separate sourced observations
  from allegations, assumptions, and model inferences. Cite sources and state
  uncertainty. You may write local UTF-8 artifacts only through the approved
  write_file tool when it is allowlisted for your role. External actions require
  an explicitly configured connector, exact connection allowlisting, role/global
  tool allowlisting, and the applicable mutation policy.

  You have access to swarm memory via the memory tool. Before starting a mission,
  recall similar past missions to build context. Store key findings for future recall.
  The Smithery MCP connector exists in the built-in registry but is disabled in this
  base configuration; do not assume it is available unless deployment policy enables it.

tools:
  allowlist:
    - search_web
    - calculate
    - read_file
    - write_file
    - mark_task_complete
    - memory
  mutation_enabled: true

# Local-model tier (Ollama). Disabled by default; the orchestrator probes
# availability at run time and transparently falls back to OpenRouter for any
# worker whose role is marked local_first. This makes long runs cheap and
# resilient: decomposition, verification, and synthesis run locally when the
# model is present, and only the high-value roles hit the network.
local:
  enabled: false          # set true + pull a model to activate
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5-coder:7b"
  request_timeout: 60
  system_prompt: |
    You are a local swarm worker. Separate sourced observations from allegations,
    assumptions, and model inferences. Express every factual claim as
    OBSERVED[<source-id>]: <exact claim>. Never invent citations, facts, dates,
    deadlines, probabilities, legal conclusions, or verification.

# Per-role tier preference. local_first roles try the local model before
# OpenRouter; all_openrouter roles always hit the network.
worker_tiers:
  local_first:
    - review_planner
    - claim_auditor
  all_openrouter:
    - source_researcher
    - counter_analyst

apex_agents:
  - role: source_researcher
    model: "openai/gpt-4.1-mini"
    allowed_tools: [search_web, calculate, read_file, write_file, mark_task_complete, memory]
    system_prompt: |
      Locate relevant sources and report what each source actually supports.
      Include URLs and publication dates when available. Label secondary sources,
      contradictions, and anything that could not be verified. When useful, write
      a local source map artifact for downstream review.

      Before starting, use memory(recall_similar) to see if this mission has been
      done before. Store key findings with memory(store) for future recall.

  - role: claim_auditor
    model: "anthropic/claude-3.5-sonnet"
    allowed_tools: [read_file, calculate, write_file, mark_task_complete, memory]
    system_prompt: |
      Audit supplied material claim by claim. Distinguish direct evidence,
      reported allegations, model inference, and unsupported conclusion.
      Identify missing exhibit, page, timestamp, or source pointers. When useful,
      write a local audit artifact that preserves gaps and contradictions.

  - role: counter_analyst
    model: "google/gemini-2.5-pro"
    allowed_tools: [search_web, read_file, calculate, write_file, mark_task_complete, memory]
    system_prompt: |
      Test competing explanations and look for disconfirming evidence. Preserve
      uncertainty and disagreements. Do not convert repetition or emotional force
      into proof. When useful, write a local counter-analysis artifact.

  - role: review_planner
    model: "openai/gpt-4.1-mini"
    allowed_tools: [read_file, calculate, write_file, mark_task_complete, memory]
    system_prompt: |
      Organize findings into reviewable, reversible next steps and draft local
      artifacts when appropriate. Keep action boundaries clear: local files are
      allowed; external filings, messages, purchases, deletions, or connected-system
      mutations require connector-specific tools and explicit policy.

agent:
  max_iterations: 10
  run_timeout: 150

orchestrator:
  parallel_agents: 4
  task_timeout: 180
  aggregation_strategy: consensus
  question_generation_prompt: |
    Decompose the following request into exactly {num_agents} independent,
    write-capable worker questions. Include source verification, claim auditing,
    counter-analysis, artifact drafting, and review planning. Do not assume case
    facts or legal conclusions. Return only a JSON array of strings.

    Request: {user_input}

  synthesis_prompt: |
    Synthesize {num_responses} worker outputs shown below.

    Preserve source links, disagreements, uncertainty, missing evidence, and
    contradictory accounts. Do not turn repeated allegations into facts. Label
    every unsupported conclusion as model inference. Do not invent probabilities,
    deadlines, legal conclusions, or automatic escalation steps. End with reviewable
    next actions and identify any local artifacts that should be written or updated.

    {agent_responses}

search:
  max_results: 5
  user_agent: "Make-It-Heavy/4.0 write-capable swarm"
